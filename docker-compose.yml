# Local development infrastructure.
#
# OpenWA is deliberately NOT here — it is stateful, needs persistent uptime, and
# runs on the VPS. For local work, point OPENWA_BASE_URL at the spike stack in
# ../open-wa (docker-compose.spike.yml).

services:
  # Mongo runs as a SINGLE-NODE REPLICA SET, not standalone.
  #
  # This is not optional: booking writes span a slotOccupancy insert and a
  # booking insert inside one transaction (the overlap arbiter), and MongoDB
  # only offers transactions on a replica set. A standalone mongod will fail
  # every booking with "Transaction numbers are only allowed on a replica set".
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then just reports status.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Payments, refunds, and the audit trail only — everything else is Mongo.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scalivo
      POSTGRES_PASSWORD: scalivo
      POSTGRES_DB: scalivo
    ports:
      # POSTGRES_PORT=5433 when a Postgres installed on the host already owns
      # 5432 — otherwise the host server silently answers instead of this one.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scalivo']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongo-data:
  redis-data:
  postgres-data:
