name: scalivo_owner
description: "Scalivo — the owner app. Bookings that live in WhatsApp."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Deliberately small. Routing is plain named routes with a navigator key —
  # go_router buys nothing at five screens, and the FCM deep link is three lines
  # either way. The QR arrives as a PNG data URL, so no QR renderer is needed.
  # Already resolved through notifications; Dart has no IANA timezone support.
  timezone: ^0.10.1
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.0.4
  # Android will not show a notification on a channel that does not exist, and
  # FCM cannot create one. This is what creates the two channels — and the
  # separation is load-bearing, see push_service.dart.
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
