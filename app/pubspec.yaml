name: scalivo_owner
description: "Scalivo — the owner app. Bookings that live in WhatsApp."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Navigation uses the existing Navigator and notification navigator key.
  # Already resolved through notifications; Dart has no IANA timezone support.
  timezone: ^0.10.1
  http: ^1.2.2
  provider: ^6.1.2
  # Native CSV selection and quoted spreadsheet parsing.
  file_selector: ^1.1.0
  csv: ^6.0.0
  # Customer booking posters and the platform share sheet.
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2
  # Already transitive through storage; used directly for one cached poster.
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.0.4
  # Android will not show a notification on a channel that does not exist, and
  # FCM cannot create one. This is what creates the two channels — and the
  # separation is load-bearing, see push_service.dart.
  flutter_local_notifications: ^19.4.2
  url_launcher: ^6.3.3
  # Photo uploads (logo, cover, portfolio, service, staff). Returns JPEG, so
  # iPhone HEIC photos arrive in a format the backend accepts.
  image_picker: ^1.1.2

dev_dependencies:
  file_selector_platform_interface: ^2.7.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
